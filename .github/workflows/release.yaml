name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: "--locked --release"
          strip: true

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            target/${{ matrix.target }}/release/bpsr-tool
            target/${{ matrix.target }}/release/bpsr-tool.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.target }}-${{ strategy.job-index }}
          path: ${{ case(runner.os == 'Windows', format('target/{0}/release/bpsr-tool.exe', matrix.target), format('target/{0}/release/bpsr-tool', matrix.target)) }}
          if-no-files-found: warn

      - name: Publish artifacts and release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: houseabsolute/actions-rust-release@v1
        with:
          executable-name: "bpsr-tool"
          target: ${{ matrix.target }}
          changes-file: "CHANGELOG.md"
