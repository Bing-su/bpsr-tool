[package]
name = "bpsr-tool"
version = "0.1.0"
edition = "2024"
description = "Blue Protocol: Star Resonance data extractor"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
camino = "1"
clap = { version = "4", features = ["derive"] }
dotnetdll = "0.3"
indicatif = "0.18"
prost = "0.14"
prost-types = "0.14"
rayon = "1"
serde_json = "1"
tempfile = "3"
zip = {
  version = "8.6",
  default-features = false,
  features = ["deflate-flate2-zlib-rs"]
}

[profile.release]
strip = true
lto = true
codegen-units = 1
