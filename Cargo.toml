[package]
name = "bpsr-tool"
version = "0.4.0"
edition = "2024"
description = "Blue Protocol: Star Resonance data extractor"
repository = "https://github.com/Bing-su/bpsr-tool"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
camino = "1"
clap = { version = "4", features = ["derive"] }
dotnetdll = "0.3"
indicatif = "0.18"
prost = "0.14"
prost-types = "0.14"
rayon = "1"
serde_json = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = "0.3"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
rstest = "0.27"

[profile.release]
strip = true
lto = true
codegen-units = 1
